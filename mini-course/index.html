<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big-O Notation &amp; Algorithm Complexity — Mini-Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --bg: #fbfbfc;
    --fg: #1c1f26;
    --muted: #5b6070;
    --muted-2: #8b909c;
    --border: #e5e7ec;
    --accent: #3454d1;
    --accent-hover: #26399c;
    --active-tint: #eef0fb;
    --card: #ffffff;
    --good: #1f8a5a;
    --good-bg: #e9f7f0;
    --bad: #c2412c;
    --bad-bg: #fbebe8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Work Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: 'Space Grotesk', sans-serif;
    margin: 0;
  }

  code, .mono {
    font-family: 'Space Mono', monospace;
  }

  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  .app-shell {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 18px;
  }

  .progress-dots {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .progress-dots .dot {
    width: 26px;
    height: 8px;
    border-radius: 5px;
    background: var(--border);
    transition: background 0.15s ease;
  }

  .progress-dots .dot.filled {
    background: var(--accent);
  }

  .layout {
    display: flex;
    flex-grow: 1;
    min-height: 0;
  }

  nav.sidebar {
    display: flex;
    flex-direction: column;
    width: 250px;
    flex-shrink: 0;
    padding: 24px 20px;
    gap: 4px;
    border-right: 1px solid var(--border);
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: transparent;
    text-align: left;
    font-size: 14px;
    color: var(--muted);
  }

  .nav-item .step-badge {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1.5px solid #c7cbd4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted-2);
  }

  .nav-item.active {
    background: var(--active-tint);
  }

  .nav-item.active .step-badge {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .nav-item.active span.nav-label {
    color: var(--fg);
    font-weight: 500;
  }

  .nav-item.done .step-badge {
    border-color: var(--accent);
    color: var(--accent);
  }

  main.lesson-pane {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    padding: 48px 64px;
    gap: 24px;
    max-width: 760px;
  }

  .kicker {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--accent);
  }

  .lesson-title {
    font-size: 30px;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  .lesson-body p {
    margin: 0 0 16px 0;
    font-size: 16px;
    line-height: 1.75;
    color: #3b3f4a;
  }

  .lesson-body h3 {
    font-size: 17px;
    font-weight: 600;
    margin: 24px 0 10px 0;
  }

  .lesson-body ul {
    margin: 0 0 16px 0;
    padding-left: 20px;
  }

  .lesson-body li {
    font-size: 16px;
    line-height: 1.75;
    color: #3b3f4a;
    margin-bottom: 6px;
  }

  .code-block {
    background: #f4f5f8;
    border-radius: 10px;
    padding: 16px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 13.5px;
    line-height: 1.7;
    color: #1c1f26;
    overflow-x: auto;
    white-space: pre;
  }

  .example-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 18px 20px;
    background: #f4f5f8;
    border-radius: 10px;
  }

  .example-box .label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted-2);
    letter-spacing: 0.06em;
  }

  .example-box p {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--fg);
  }

  /* --- Interactive simulator --- */

  .simulator {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 22px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .sim-controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sim-n-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--fg);
  }

  .sim-n-row .sim-n-value {
    font-family: 'Space Mono', monospace;
    color: var(--accent);
    font-weight: 700;
    min-width: 26px;
    text-align: right;
  }

  .sim-n-row input[type="range"] {
    flex-grow: 1;
    accent-color: var(--accent);
  }

  .sim-toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
  }

  .sim-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    user-select: none;
  }

  .sim-toggle input {
    accent-color: var(--sim-color, var(--accent));
  }

  .sim-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .sim-bars {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 96px 1fr 92px;
    align-items: center;
    gap: 12px;
  }

  .bar-row .bar-name {
    font-family: 'Space Mono', monospace;
    font-size: 12.5px;
    color: var(--fg);
  }

  .bar-track {
    height: 14px;
    background: #f0f1f4;
    border-radius: 7px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 7px;
    transition: width 0.2s ease;
  }

  .bar-row .bar-value {
    font-family: 'Space Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
    text-align: right;
  }

  .sim-note {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0;
  }

  /* --- Check-in / quiz --- */

  .quiz {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 22px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-top: 8px;
  }

  .quiz .quiz-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
  }

  .quiz-intro {
    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
    margin: -8px 0 0 0;
  }

  .quiz-block + .quiz-block {
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .quiz-question {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .quiz-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 14.5px;
    color: var(--fg);
    text-align: left;
  }

  .quiz-option:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .quiz-option.selected {
    border-color: var(--accent);
    background: var(--active-tint);
  }

  .quiz-option.correct {
    border-color: var(--good);
    background: var(--good-bg);
    color: var(--good);
  }

  .quiz-option.incorrect {
    border-color: var(--bad);
    background: var(--bad-bg);
    color: var(--bad);
  }

  .quiz-option:disabled {
    cursor: default;
  }

  .short-answer-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 14.5px;
    color: var(--fg);
  }

  .short-answer-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .short-answer-input:disabled {
    background: #f4f5f8;
    color: var(--muted);
  }

  .quiz-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .btn-primary:disabled {
    background: #c7cbd4;
    cursor: not-allowed;
  }

  .quiz-feedback {
    font-size: 14px;
    line-height: 1.6;
  }

  .quiz-feedback.good { color: var(--good); }
  .quiz-feedback.bad { color: var(--bad); }

  .quiz-summary {
    font-size: 14.5px;
    font-weight: 500;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .lesson-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 18px;
  }

  .lesson-nav-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    background: transparent;
    border: none;
    padding: 0;
  }

  .lesson-nav-btn.prev {
    color: var(--muted-2);
  }

  .lesson-nav-btn.next {
    color: #fff;
    background: var(--accent);
    padding: 9px 18px;
    border-radius: 8px;
  }

  .lesson-nav-btn.next:hover { background: var(--accent-hover); }

  .lesson-nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Mobile: sidebar collapses to a horizontal, scrollable step strip above content */
  @media (max-width: 720px) {
    header.top-bar {
      padding: 16px 20px;
    }

    .layout {
      flex-direction: column;
    }

    nav.sidebar {
      flex-direction: row;
      width: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      padding: 14px 16px;
      gap: 8px;
    }

    .nav-item {
      flex-shrink: 0;
      white-space: nowrap;
    }

    main.lesson-pane {
      padding: 32px 20px;
      max-width: none;
    }

    .lesson-title {
      font-size: 24px;
    }

    .bar-row {
      grid-template-columns: 76px 1fr 76px;
    }
  }
</style>
</head>

<div class="app-shell">
  <header class="top-bar">
    <span class="brand">Big-O Notation &amp; Algorithm Complexity</span>
    <div class="progress-dots" id="progress-dots"></div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Course sections"></nav>
    <main class="lesson-pane" id="lesson-pane"></main>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---- Growth functions used by both Lesson 2's text and the simulator ----
  var COMPLEXITY_CLASSES = [
    { key: "o1", label: "O(1)", color: "#1f8a5a", fn: function () { return 1; } },
    { key: "ologn", label: "O(log n)", color: "#3454d1", fn: function (n) { return Math.max(1, Math.ceil(Math.log2(n))); } },
    { key: "on", label: "O(n)", color: "#c47a1f", fn: function (n) { return n; } },
    { key: "onlogn", label: "O(n log n)", color: "#7b3fa0", fn: function (n) { return Math.max(1, Math.ceil(n * Math.log2(Math.max(n, 1)))); } },
    { key: "on2", label: "O(n²)", color: "#c2412c", fn: function (n) { return n * n; } },
    { key: "o2n", label: "O(2ⁿ)", color: "#16181d", fn: function (n) { return Math.pow(2, n); } }
  ];

  var LESSONS = [
    {
      id: "what-is-big-o",
      kind: "lesson",
      navLabel: "What Is Big-O?",
      title: "What Is Big-O Notation?",
      kicker: "LESSON 1",
      body: [
        { paragraphs: [
          "When you write code that works, the next question is usually: does it still work when the input gets big? Big-O notation is the standard way programmers describe how the running time (or memory use) of an algorithm grows as the size of its input, usually called <code class=\"mono\">n</code>, grows.",
          "It doesn't measure exact seconds or bytes &mdash; those depend on the machine, the language, and a hundred other details. Instead, Big-O describes the <em>shape</em> of the growth curve: does doubling the input double the work? Square it? Barely change it at all?"
        ]},
        { heading: "Why bother with an approximation?", paragraphs: [
          "Because it lets you compare algorithms without running them. Two algorithms that solve the same problem can behave identically on a 10-item list and completely differently on a 10-million-item list. Big-O is what tells you which one will still be usable at scale, before you ever hit that scale."
        ]},
        { heading: "A concrete comparison", paragraphs: [
          "Say you need to check whether a value exists in a collection of <code class=\"mono\">n</code> items.",
          "Searching an unsorted array means checking items one by one in the worst case &mdash; the work grows in direct proportion to <code class=\"mono\">n</code>. Looking the same value up in a hash map takes roughly the same small amount of work no matter how large the collection is. Big-O gives these two behaviors names: <code class=\"mono\">O(n)</code> for the first, <code class=\"mono\">O(1)</code> for the second."
        ]},
        { list: [
          "Big-O describes <strong>worst-case growth</strong>, not a stopwatch measurement.",
          "It ignores constant factors and lower-order terms &mdash; <code class=\"mono\">O(2n)</code> and <code class=\"mono\">O(n + 5)</code> are both just written <code class=\"mono\">O(n)</code>.",
          "It's a tool for comparing algorithms' scalability, not for predicting exact runtimes."
        ]}
      ],
      checkIn: {
        type: "short",
        question: "In your own words: what does the variable n typically represent in Big-O notation?",
        acceptableContains: ["input size", "size of the input", "size of input", "number of elements", "number of items", "input's size"],
        explanation: "n usually stands for the size of the input — the number of elements or items the algorithm has to work with."
      }
    },
    {
      id: "complexity-classes",
      kind: "lesson",
      navLabel: "Complexity Classes",
      title: "Common Complexity Classes",
      kicker: "LESSON 2",
      body: [
        { paragraphs: [
          "Most algorithms you'll encounter fall into a small handful of growth patterns. Learning to recognize them by sight &mdash; and by a few characteristic code shapes &mdash; is most of what \"thinking in Big-O\" means in practice."
        ]},
        { heading: "O(1) — Constant time", paragraphs: [
          "The work doesn't depend on input size at all. Accessing an array element by index, or reading a value from a hash map, are classic examples."
        ]},
        { heading: "O(log n) — Logarithmic time", paragraphs: [
          "The work grows very slowly because each step eliminates a large fraction of the remaining problem. Binary search is the textbook example: each comparison halves the space left to search."
        ]},
        { heading: "O(n) — Linear time", paragraphs: [
          "The work grows in direct proportion to the input. Scanning every item in a list once &mdash; to sum it, print it, or search it without shortcuts &mdash; is O(n)."
        ]},
        { heading: "O(n log n) — Linearithmic time", paragraphs: [
          "Common in efficient sorting algorithms (merge sort, heapsort, and typical implementations of quicksort). It behaves like doing O(log n) work, n times over."
        ]},
        { heading: "O(n²) — Quadratic time", paragraphs: [
          "Typically comes from nested loops over the same input &mdash; comparing every item to every other item, as in a simple bubble sort or a naive duplicate check."
        ]},
        { code: "// O(1)\nfunction firstItem(arr) { return arr[0]; }\n\n// O(log n)\nfunction binarySearch(arr, target) { /* halves the range each step */ }\n\n// O(n)\nfunction sum(arr) {\n  let total = 0;\n  for (const x of arr) total += x;\n  return total;\n}\n\n// O(n^2)\nfunction hasDuplicate(arr) {\n  for (let i = 0; i < arr.length; i++)\n    for (let j = 0; j < arr.length; j++)\n      if (i !== j && arr[i] === arr[j]) return true;\n  return false;\n}" },
        { paragraphs: [
          "Ranked from fastest-growing to slowest-growing for large <code class=\"mono\">n</code>: <code class=\"mono\">O(1)</code> &lt; <code class=\"mono\">O(log n)</code> &lt; <code class=\"mono\">O(n)</code> &lt; <code class=\"mono\">O(n log n)</code> &lt; <code class=\"mono\">O(n&sup2;)</code> &lt; <code class=\"mono\">O(2&sup2;)</code>. The further right you are on that list, the more painful large inputs become. The next section lets you play with these growth rates directly."
        ]}
      ],
      checkIn: {
        type: "mc",
        question: "Which of these grows fastest as n increases?",
        options: ["O(n)", "O(log n)", "O(n²)", "O(1)"],
        correctIndex: 2,
        explanation: "O(n²) grows fastest among these options — quadratic growth outpaces linear, logarithmic, and constant time."
      }
    },
    {
      id: "analyzing-code",
      kind: "lesson",
      navLabel: "Analyzing Code",
      title: "Analyzing Code for Time Complexity",
      kicker: "LESSON 3",
      body: [
        { paragraphs: [
          "In practice, you rarely derive Big-O from a formal proof &mdash; you read the code and reason about how the work scales. A few rules of thumb cover the vast majority of cases."
        ]},
        { heading: "Rule 1: A single loop over the input is O(n)", paragraphs: [
          "If a loop runs once per element and does a constant amount of work each time, the whole loop is O(n)."
        ]},
        { heading: "Rule 2: Nested loops multiply", paragraphs: [
          "A loop inside another loop, each running roughly n times, gives O(n) &times; O(n) = O(n&sup2;). Three nested loops over the same input give O(n&sup3;), and so on."
        ]},
        { heading: "Rule 3: Sequential (non-nested) steps add, then you keep the largest", paragraphs: [
          "Code that does an O(n) pass followed by a separate O(n&sup2;) pass is O(n) + O(n&sup2;), which simplifies to just O(n&sup2;) &mdash; the slower-growing term is dropped because it becomes insignificant next to the faster-growing one."
        ]},
        { heading: "Rule 4: Halving the problem each step suggests O(log n)", paragraphs: [
          "If a loop or recursive call divides the remaining work by a constant factor each time (like binary search cutting the array in half), that's the signature of logarithmic growth."
        ]},
        { code: "function example(arr) {\n  let total = 0;\n  for (const x of arr) {       // O(n)\n    total += x;\n  }\n\n  for (const x of arr) {       // another O(n) ...\n    for (const y of arr) {     // ... nested inside another O(n)\n      if (x === y) total++;    // => O(n^2) overall for this block\n    }\n  }\n\n  return total;                // Combined: O(n) + O(n^2) => O(n^2)\n}" },
        { paragraphs: [
          "Walking through a snippet like this line by line, labeling each loop's contribution, is usually enough to reach the right answer without any formal machinery."
        ]}
      ],
      checkIn: {
        type: "mc",
        question: "Two independent (non-nested) loops, each O(n), one after another, combine to give what overall complexity?",
        options: ["O(n)", "O(n²)", "O(n log n)", "O(1)"],
        correctIndex: 0,
        explanation: "Sequential O(n) steps add together: O(n) + O(n) = O(2n), which simplifies to O(n) since constant multipliers are dropped."
      }
    },
    {
      id: "space-complexity",
      kind: "lesson",
      navLabel: "Space & Trade-offs",
      title: "Space Complexity & Time-Space Trade-offs",
      kicker: "LESSON 4",
      body: [
        { paragraphs: [
          "Big-O isn't only about time. <strong>Space complexity</strong> measures how much extra memory an algorithm needs, as a function of input size &mdash; and it uses the exact same notation."
        ]},
        { heading: "What counts as \"extra\" memory", paragraphs: [
          "Space complexity usually refers to <em>auxiliary space</em>: memory the algorithm allocates beyond the input itself. A function that only uses a few variables regardless of input size is O(1) space. A function that builds a new array the same size as its input is O(n) space."
        ]},
        { heading: "The classic trade-off: memoization", paragraphs: [
          "A naive recursive Fibonacci function recomputes the same values over and over, giving exponential time complexity but using very little memory. Adding a cache (memoization) that stores each computed value the first time it's needed cuts the time complexity dramatically &mdash; down to O(n) &mdash; at the cost of O(n) extra space to store the cache."
        ]},
        { code: "// Naive: O(2^n) time, O(n) space (call stack only)\nfunction fib(n) {\n  if (n <= 1) return n;\n  return fib(n - 1) + fib(n - 2);\n}\n\n// Memoized: O(n) time, O(n) space (call stack + cache)\nfunction fibMemo(n, cache = new Map()) {\n  if (n <= 1) return n;\n  if (cache.has(n)) return cache.get(n);\n  const result = fibMemo(n - 1, cache) + fibMemo(n - 2, cache);\n  cache.set(n, result);\n  return result;\n}" },
        { paragraphs: [
          "This is the essence of a time-space trade-off: spending more memory to avoid repeating work, or the reverse &mdash; recomputing values on the fly to avoid storing them. Neither choice is universally \"better\"; it depends on which resource, time or memory, is scarcer for your particular situation."
        ]},
        { list: [
          "Space complexity uses the same <code class=\"mono\">O(...)</code> notation as time complexity, describing memory instead of steps.",
          "Auxiliary space is extra memory used beyond the input; it's usually what \"space complexity\" refers to.",
          "Trading space for time (caching, precomputed lookup tables, hash maps) is one of the most common optimization patterns in practice."
        ]}
      ],
      checkIn: {
        type: "mc",
        question: "What does memoizing a recursive function typically trade to improve its time complexity?",
        options: ["Accuracy for speed", "Extra memory (space) for reduced time", "Readability for performance", "Nothing — it's free"],
        correctIndex: 1,
        explanation: "Memoization stores previously computed results, trading additional space for a reduction in repeated work (time)."
      }
    },
    {
      id: "simulator",
      kind: "simulator",
      navLabel: "Growth Simulator",
      title: "Simulator: Compare Growth Rates Live",
      kicker: "LESSON 5",
      body: [
        { paragraphs: [
          "Reading about complexity classes only goes so far &mdash; the difference between O(n) and O(n&sup2;) becomes obvious once you can see the operation counts side by side. Drag the slider below to change the input size <code class=\"mono\">n</code>, and watch how many operations each complexity class needs at that size."
        ]}
      ],
      checkIn: {
        type: "mc",
        question: "In the simulator, as n grows large, which curve pulls away from the others fastest?",
        options: ["O(1)", "O(log n)", "O(n)", "O(2ⁿ)"],
        correctIndex: 3,
        explanation: "Exponential growth (O(2ⁿ)) outpaces every other class shown here, even for fairly modest values of n."
      }
    },
    {
      id: "final-quiz",
      kind: "final",
      navLabel: "Final Quiz",
      title: "Final Quiz: Test Your Knowledge",
      kicker: "FINAL QUIZ",
      intro: "Three questions covering everything from this course. Answer each one to see how you did.",
      questions: [
        {
          question: "Which best describes what Big-O notation measures?",
          options: ["Exact runtime in seconds", "How resource use scales with input size", "Number of bugs in the code", "Memory address size"],
          correctIndex: 1,
          explanation: "Big-O describes how an algorithm's time or space needs grow as input size increases — not a literal timing or bug count."
        },
        {
          question: "Which of these has the smallest (slowest) growth rate for large n?",
          options: ["O(n²)", "O(n log n)", "O(log n)", "O(n)"],
          correctIndex: 2,
          explanation: "Of these four, O(log n) grows the slowest — each step only needs to eliminate a fraction of the remaining problem."
        },
        {
          question: "What is the main cost of using memoization to speed up a recursive algorithm?",
          options: ["It requires additional memory to store cached results", "It makes the algorithm less accurate", "It only works on sorted data", "It increases the time complexity"],
          correctIndex: 0,
          explanation: "Memoization trades space for time: the cache of previously computed results has to be stored somewhere."
        }
      ]
    }
  ];

  // ---- State ----

  var sectionState = {};
  LESSONS.forEach(function (section) {
    if (section.kind === "lesson" || section.kind === "simulator") {
      sectionState[section.id] = section.checkIn.type === "mc"
        ? { selected: null, submitted: false }
        : { text: "", submitted: false };
    } else if (section.kind === "final") {
      sectionState[section.id] = section.questions.map(function () {
        return { selected: null, submitted: false };
      });
    }
  });

  var simState = { n: 10, enabled: {} };
  COMPLEXITY_CLASSES.forEach(function (c) { simState.enabled[c.key] = true; });

  var currentIndex = 0;

  var sidebarEl = document.getElementById("sidebar");
  var laneEl = document.getElementById("lesson-pane");
  var dotsEl = document.getElementById("progress-dots");

  // ---- Sidebar / progress ----

  function renderSidebar() {
    sidebarEl.innerHTML = "";
    LESSONS.forEach(function (section, i) {
      var btn = document.createElement("button");
      btn.className = "nav-item" + (i === currentIndex ? " active" : "") + (i < currentIndex ? " done" : "");
      btn.setAttribute("type", "button");
      btn.innerHTML =
        '<span class="step-badge">' + (i + 1) + '</span>' +
        '<span class="nav-label">' + section.navLabel + '</span>';
      btn.addEventListener("click", function () { goToLesson(i); });
      sidebarEl.appendChild(btn);
    });
  }

  function renderDots() {
    dotsEl.innerHTML = "";
    LESSONS.forEach(function (_, i) {
      var dot = document.createElement("div");
      dot.className = "dot" + (i <= currentIndex ? " filled" : "");
      dotsEl.appendChild(dot);
    });
  }

  // ---- Lesson body rendering ----

  function renderBodyBlock(block) {
    var html = "";
    if (block.heading) {
      html += "<h3>" + block.heading + "</h3>";
    }
    if (block.paragraphs) {
      block.paragraphs.forEach(function (p) {
        html += "<p>" + p + "</p>";
      });
    }
    if (block.list) {
      html += "<ul>" + block.list.map(function (li) { return "<li>" + li + "</li>"; }).join("") + "</ul>";
    }
    if (block.code) {
      html += '<div class="code-block">' + escapeHtml(block.code) + "</div>";
    }
    return html;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---- Simulator ----

  function renderSimulator() {
    var wrap = document.createElement("div");
    wrap.className = "simulator";

    var controls = document.createElement("div");
    controls.className = "sim-controls";

    var nRow = document.createElement("div");
    nRow.className = "sim-n-row";
    var nLabel = document.createElement("label");
    nLabel.textContent = "Input size n =";
    nLabel.setAttribute("for", "sim-slider");
    var nValue = document.createElement("span");
    nValue.className = "sim-n-value mono";
    nValue.textContent = simState.n;
    var slider = document.createElement("input");
    slider.type = "range";
    slider.id = "sim-slider";
    slider.min = "1";
    slider.max = "30";
    slider.value = String(simState.n);
    slider.addEventListener("input", function () {
      simState.n = parseInt(slider.value, 10);
      updateSimulatorOutput();
    });
    nRow.appendChild(nLabel);
    nRow.appendChild(slider);
    nRow.appendChild(nValue);
    controls.appendChild(nRow);

    var toggles = document.createElement("div");
    toggles.className = "sim-toggles";
    COMPLEXITY_CLASSES.forEach(function (c) {
      var toggle = document.createElement("label");
      toggle.className = "sim-toggle";
      var swatch = document.createElement("span");
      swatch.className = "sim-swatch";
      swatch.style.background = c.color;
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = simState.enabled[c.key];
      cb.addEventListener("change", function () {
        simState.enabled[c.key] = cb.checked;
        updateSimulatorOutput();
      });
      toggle.appendChild(cb);
      toggle.appendChild(swatch);
      toggle.appendChild(document.createTextNode(c.label));
      toggles.appendChild(toggle);
    });
    controls.appendChild(toggles);

    wrap.appendChild(controls);

    var barsWrap = document.createElement("div");
    barsWrap.className = "sim-bars";
    barsWrap.id = "sim-bars";
    wrap.appendChild(barsWrap);

    var note = document.createElement("p");
    note.className = "sim-note";
    note.id = "sim-note";
    wrap.appendChild(note);

    renderSimulatorBars(barsWrap);
    updateSimulatorNote(note);

    return wrap;
  }

  function renderSimulatorBars(barsWrap) {
    barsWrap.innerHTML = "";
    COMPLEXITY_CLASSES.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "bar-row";
      row.dataset.key = c.key;
      row.style.display = simState.enabled[c.key] ? "grid" : "none";

      var name = document.createElement("div");
      name.className = "bar-name";
      name.textContent = c.label;
      row.appendChild(name);

      var track = document.createElement("div");
      track.className = "bar-track";
      var fill = document.createElement("div");
      fill.className = "bar-fill";
      fill.style.background = c.color;
      track.appendChild(fill);
      row.appendChild(track);

      var value = document.createElement("div");
      value.className = "bar-value mono";
      row.appendChild(value);

      barsWrap.appendChild(row);
    });
    updateSimulatorBarValues(barsWrap);
  }

  function updateSimulatorBarValues(barsWrap) {
    var n = simState.n;
    var maxVal = 1;
    COMPLEXITY_CLASSES.forEach(function (c) {
      if (simState.enabled[c.key]) maxVal = Math.max(maxVal, c.fn(n));
    });
    var logMax = Math.log10(maxVal + 1) || 1;

    COMPLEXITY_CLASSES.forEach(function (c) {
      var row = barsWrap.querySelector('.bar-row[data-key="' + c.key + '"]');
      if (!row) return;
      row.style.display = simState.enabled[c.key] ? "grid" : "none";
      var val = c.fn(n);
      var pct = Math.max(2, Math.round((Math.log10(val + 1) / logMax) * 100));
      row.querySelector(".bar-fill").style.width = pct + "%";
      row.querySelector(".bar-value").textContent = val.toLocaleString() + (val === 1 ? " step" : " steps");
    });
  }

  function updateSimulatorNote(note) {
    var o2n = COMPLEXITY_CLASSES.filter(function (c) { return c.key === "o2n"; })[0];
    var on = COMPLEXITY_CLASSES.filter(function (c) { return c.key === "on"; })[0];
    var ratio = Math.round(o2n.fn(simState.n) / on.fn(simState.n));
    note.textContent = "At n = " + simState.n + ", O(2ⁿ) already needs about " + ratio.toLocaleString() +
      "× as many steps as O(n). That gap only widens as n grows further.";
  }

  function updateSimulatorOutput() {
    var nValue = document.querySelector("#sim-slider").parentElement.querySelector(".sim-n-value");
    if (nValue) nValue.textContent = simState.n;
    var barsWrap = document.getElementById("sim-bars");
    if (barsWrap) updateSimulatorBarValues(barsWrap);
    var note = document.getElementById("sim-note");
    if (note) updateSimulatorNote(note);
  }

  // ---- Check-in (single question per lesson/simulator section) ----

  function renderCheckIn(section) {
    var q = section.checkIn;
    var state = sectionState[section.id];

    var wrap = document.createElement("div");
    wrap.className = "quiz";

    var heading = document.createElement("div");
    heading.className = "quiz-heading";
    heading.textContent = "Check your understanding";
    wrap.appendChild(heading);

    wrap.appendChild(buildQuestionBlock(q, state, { numbered: false }));

    return wrap;
  }

  // ---- Final quiz (3 questions) ----

  function renderFinalQuiz(section) {
    var states = sectionState[section.id];

    var wrap = document.createElement("div");
    wrap.className = "quiz";

    var intro = document.createElement("p");
    intro.className = "quiz-intro";
    intro.textContent = section.intro;
    wrap.appendChild(intro);

    section.questions.forEach(function (q, qi) {
      wrap.appendChild(buildQuestionBlock(q, states[qi], { numbered: true, number: qi + 1 }));
    });

    var allSubmitted = states.every(function (s) { return s.submitted; });
    if (allSubmitted) {
      var correctCount = states.filter(function (s) { return s.selected === section.questions[states.indexOf(s)].correctIndex; }).length;
      var summary = document.createElement("div");
      summary.className = "quiz-summary";
      summary.textContent = "You got " + correctCount + " out of " + section.questions.length + " correct.";
      wrap.appendChild(summary);
    }

    return wrap;
  }

  // ---- Shared question block (used by both check-ins and the final quiz) ----

  function buildQuestionBlock(q, state, opts) {
    var qWrap = document.createElement("div");
    qWrap.className = "quiz-block";

    var qText = document.createElement("div");
    qText.className = "quiz-question";
    qText.textContent = (opts.numbered ? opts.number + ". " : "") + q.question;
    qWrap.appendChild(qText);

    var checkBtn = document.createElement("button");
    checkBtn.type = "button";
    checkBtn.className = "btn btn-primary";
    checkBtn.textContent = state.submitted ? "Checked" : "Check answer";

    function refreshCheckBtn() {
      var hasAnswer = q.type === "short" ? (state.text && state.text.trim().length > 0) : state.selected !== null;
      checkBtn.disabled = !hasAnswer || state.submitted;
    }

    if (q.type === "mc" || q.options) {
      var optsWrap = document.createElement("div");
      optsWrap.className = "quiz-options";

      q.options.forEach(function (opt, oi) {
        var optBtn = document.createElement("button");
        optBtn.type = "button";
        optBtn.className = "quiz-option";
        if (state.selected === oi) optBtn.classList.add("selected");
        if (state.submitted) {
          optBtn.disabled = true;
          if (oi === q.correctIndex) optBtn.classList.add("correct");
          else if (oi === state.selected) optBtn.classList.add("incorrect");
        }
        optBtn.textContent = opt;
        optBtn.addEventListener("click", function () {
          state.selected = oi;
          state.submitted = false;
          renderLesson();
        });
        optsWrap.appendChild(optBtn);
      });
      qWrap.appendChild(optsWrap);
    } else {
      var input = document.createElement("input");
      input.type = "text";
      input.className = "short-answer-input";
      input.placeholder = "Type your answer…";
      input.value = state.text || "";
      input.disabled = state.submitted;
      input.addEventListener("input", function () {
        state.text = input.value;
        refreshCheckBtn();
      });
      qWrap.appendChild(input);
    }

    var actions = document.createElement("div");
    actions.className = "quiz-actions";

    refreshCheckBtn();
    checkBtn.addEventListener("click", function () {
      state.submitted = true;
      renderLesson();
    });
    actions.appendChild(checkBtn);
    qWrap.appendChild(actions);

    if (state.submitted) {
      var isCorrect = q.type === "short"
        ? isShortAnswerCorrect(state.text, q.acceptableContains)
        : state.selected === q.correctIndex;
      var feedback = document.createElement("div");
      feedback.className = "quiz-feedback " + (isCorrect ? "good" : "bad");
      feedback.textContent = (isCorrect ? "Correct. " : "Not quite. ") + q.explanation;
      qWrap.appendChild(feedback);
    }

    return qWrap;
  }

  function isShortAnswerCorrect(text, acceptableContains) {
    var normalized = (text || "").toLowerCase().replace(/[^a-z0-9\s]/g, "").trim();
    return acceptableContains.some(function (phrase) {
      return normalized.indexOf(phrase) !== -1;
    });
  }

  // ---- Top-level render ----

  function renderLesson() {
    var section = LESSONS[currentIndex];
    laneEl.innerHTML = "";

    var kicker = document.createElement("div");
    kicker.className = "kicker";
    kicker.textContent = section.kicker;
    laneEl.appendChild(kicker);

    var title = document.createElement("h1");
    title.className = "lesson-title";
    title.textContent = section.title;
    laneEl.appendChild(title);

    if (section.kind === "lesson" || section.kind === "simulator") {
      var body = document.createElement("div");
      body.className = "lesson-body";
      body.innerHTML = section.body.map(renderBodyBlock).join("");
      laneEl.appendChild(body);

      if (section.kind === "simulator") {
        laneEl.appendChild(renderSimulator());
      }

      laneEl.appendChild(renderCheckIn(section));
    } else if (section.kind === "final") {
      laneEl.appendChild(renderFinalQuiz(section));
    }

    var navWrap = document.createElement("div");
    navWrap.className = "lesson-nav";

    var prevBtn = document.createElement("button");
    prevBtn.type = "button";
    prevBtn.className = "lesson-nav-btn prev";
    prevBtn.textContent = "← Previous";
    prevBtn.disabled = currentIndex === 0;
    prevBtn.addEventListener("click", function () { goToLesson(currentIndex - 1); });
    navWrap.appendChild(prevBtn);

    var nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.className = "lesson-nav-btn next";
    nextBtn.textContent = currentIndex === LESSONS.length - 1 ? "Finish" : "Next section →";
    nextBtn.disabled = currentIndex === LESSONS.length - 1;
    nextBtn.addEventListener("click", function () { goToLesson(currentIndex + 1); });
    navWrap.appendChild(nextBtn);

    laneEl.appendChild(navWrap);

    renderSidebar();
    renderDots();
  }

  function goToLesson(index) {
    if (index < 0 || index >= LESSONS.length) return;
    currentIndex = index;
    renderLesson();
    laneEl.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  renderLesson();
})();
</script>
</body>
</html>
