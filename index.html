<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S220 Lab Portal</title>
<meta name="description" content="Tools and lessons for the P.A. Hilton S220 Rankine Cycle Steam Turbine lab: a turbine performance calculator and an interactive Rankine cycle explainer.">

<!-- Apply the saved (or OS) theme before first paint to avoid a flash. -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('s220-theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18/dist/index.global.js"></script>
<!-- Theme tokens live in CSS variables (below) so one Tailwind class covers both themes. -->
<style type="text/tailwindcss">
  @custom-variant dark (&:where(.dark, .dark *));
  @theme inline {
    --color-bg: var(--bg);
    --color-surface: var(--surface);
    --color-line: var(--line);
    --color-fg: var(--fg);
    --color-muted: var(--muted);
    --color-accent: var(--accent);
    --color-accent-ink: var(--accent-ink);
    --color-on-accent: var(--on-accent);
    --color-steel: var(--steel);
    --color-series: var(--series);
    --font-display: "Barlow Condensed", sans-serif;
    --font-sans: Barlow, sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }
  @theme {
    --animate-flow: flow 0.9s linear infinite;
    @keyframes flow { to { stroke-dashoffset: -12; } }
  }
</style>
<style>
  :root {
    --bg: #f4f5f6; --surface: #ffffff; --line: #d3d8dc;
    --fg: #16181a; --muted: #555d64;
    --accent: #f08a24; --accent-ink: #a85500; --on-accent: #16181a;   /* accent-ink ≥4.5:1 on bg and surface */
    --steel: #2f6aa3;
    --series: #b35c00;          /* chart marks; validated vs surface (dataviz validator) */
    color-scheme: light;
  }
  .dark {
    --bg: #16181a; --surface: #202326; --line: #34383c;
    --fg: #eceff1; --muted: #a3aab0;
    --accent: #f08a24; --accent-ink: #f5a04f; --on-accent: #16181a;
    --steel: #7fb2e5;
    --series: #d6771b;
    color-scheme: dark;
  }
</style>
</head>

<script>
'use strict';

// ===== S220 rig constants (S220 manual, "Useful Data") =====
const S220 = {
  brakeRadius: 0.023,        // m, effective radius to belt centre line
  rotorInertia: 49.7e-6,     // kg·m², rotating parts
  cpWater: 4.18,             // kJ/(kg·K), condenser cooling water
  heatLossCoeff: 3.2,        // W/K: Qr = 3.2·(t5 − ta)
  overspeedRpm: 40000,
  condensateDensity: 1,      // g/cm³ — the manual takes 1 cm³ condensate = 1 g
};

// ===== Performance calculations (pure functions; SI units unless named) =====
const Perf = {
  absBar: (gaugeBar, atmMbar) => gaugeBar + atmMbar / 1000,
  brakeTorque: (loadN) => loadN * S220.brakeRadius,                       // N·m
  shaftPower: (torqueNm, rpm) => torqueNm * 2 * Math.PI * rpm / 60,        // W
  steamFlow: (volumeCm3, seconds) => volumeCm3 * S220.condensateDensity / 1000 / seconds, // kg/s
  specificSteamConsumption: (flowKgS, powerW) => flowKgS * 3600 / (powerW / 1000), // kg/kWh
  coolingWaterHeat: (flowGS, t3, t4) => flowGS * S220.cpWater * (t4 - t3), // W (g/s × kJ/kg·K × K)
  heatLoss: (t5, ta) => S220.heatLossCoeff * (t5 - ta),                    // W

  // One observation-sheet row → every derived quantity. Missing inputs give null outputs.
  computeReading({ atmMbar, inletBarG, exhaustBarG, rpm, loadN, condensateCm3, condensateTimeS }) {
    const ok = (...v) => v.every((x) => typeof x === 'number' && Number.isFinite(x));
    const inletAbs = ok(inletBarG, atmMbar) ? Perf.absBar(inletBarG, atmMbar) : null;
    const exhaustAbs = ok(exhaustBarG, atmMbar) ? Perf.absBar(exhaustBarG, atmMbar) : null;
    const torque = ok(loadN) ? Perf.brakeTorque(loadN) : null;
    const power = ok(torque, rpm) ? Perf.shaftPower(torque, rpm) : null;
    const flow = ok(condensateCm3, condensateTimeS) && condensateTimeS > 0 ? Perf.steamFlow(condensateCm3, condensateTimeS) : null;
    const ssc = ok(flow, power) && power > 0 ? Perf.specificSteamConsumption(flow, power) : null;
    return { inletAbs, exhaustAbs, torque, power, flow, ssc };
  },
};

// ===== Steam properties (IAPWS-IF97 via the iapws-if97 package, MIT) =====
// Loaded from pinned files on jsDelivr (pure ES modules, no dependencies).
// Wrapper units: pressure bar abs, temperature °C, h kJ/kg, s kJ/(kg·K).
const STEAM_LIB_URL = 'https://cdn.jsdelivr.net/npm/iapws-if97@2.2.0/dist/index.js';

class SteamUnavailableError extends Error {}

const Steam = (() => {
  let lib = null;
  const api = { status: 'loading' };
  const toState = (r) => ({
    p: r.pressure * 10, T: r.temperature - 273.15, h: r.enthalpy, s: r.entropy,
    v: r.specificVolume, x: r.quality, region: r.region,
  });
  const need = () => {
    if (!lib) throw new SteamUnavailableError('Steam property library is not available.');
    return lib;
  };

  api.ready = import(STEAM_LIB_URL).then(
    (mod) => { lib = mod; api.status = 'ready'; },
    () => { api.status = 'failed'; }
  ).then(() => { window.dispatchEvent(new Event('steamstatus')); });

  api.pt = (pBar, tC) => toState(need().solvePT(pBar / 10, tC + 273.15));
  api.ph = (pBar, h) => toState(need().solvePH(pBar / 10, h));
  api.ps = (pBar, s) => toState(need().solvePS(pBar / 10, s));
  api.px = (pBar, x) => toState(need().solvePx(pBar / 10, x));
  api.tx = (tC, x) => toState(need().solveTx(tC + 273.15, x));
  // Saturated liquid (f) and vapour (g) at a pressure, plus the fg differences.
  api.sat = (pBar) => {
    const f = api.px(pBar, 0), g = api.px(pBar, 1);
    return { p: pBar, T: f.T, hf: f.h, hg: g.h, hfg: g.h - f.h, sf: f.s, sg: g.s, sfg: g.s - f.s, vf: f.v, vg: g.v };
  };
  return api;
})();

// ===== Manual sample data (S220 manual, experiment 2) =====
// Values as printed except where an erratum corrects them; each correction is
// listed in `errata` so the UI can flag where it differs from the manual.

  { id: 'A', experiment: '2a', page: 46, atmMbar: 1003, ambientC: 22, inletBarG: 4.6, exhaustBarG: 0, condensateCm3: 200, condensateTimeS: 117,

// ===== Storage (localStorage, namespaced; tolerant of blocked storage) =====
const Store = {
  key: (k) => 's220:' + k,
  get(k, fallback) {
    try {
      const raw = localStorage.getItem(Store.key(k));
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  set(k, value) {
    try { localStorage.setItem(Store.key(k), JSON.stringify(value)); return true; } catch (e) { return false; }
  },
  remove(k) {
    try { localStorage.removeItem(Store.key(k)); } catch (e) {}
  },
};

// ===== CSV export =====
const Csv = {
  cell(v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'number') return Number.isFinite(v) ? String(v) : '';
    let s = String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;   // keep spreadsheets from treating text as a formula
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  },
  build: (rows) => rows.map((r) => r.map(Csv.cell).join(',')).join('\r\n'),
  download(filename, rows) {
    const blob = new Blob(['﻿' + Csv.build(rows)], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
};

const CHART_LIB_URL = 'https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js';
const Libs = {
  pending: {},
  load(url) {
    if (!Libs.pending[url]) {
      Libs.pending[url] = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = resolve;
        script.onerror = () => { delete Libs.pending[url]; script.remove(); reject(new Error('Failed to load ' + url)); };
        document.head.append(script);
      });
    }
    return Libs.pending[url];
  },
};

// ===== Shared: ARIA tabs (role=tab buttons with data-mode + aria-controls) =====
// Wires click + arrow/Home/End keys; returns select(mode). onChange runs after each switch.
function wireTabs(root, initial, onChange) {
  const tabs = [...root.querySelectorAll('[role="tab"]')];
  function select(mode, focus) {
    tabs.forEach((t) => {
      const on = t.dataset.mode === mode;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
      t.classList.toggle('bg-accent', on);
      t.classList.toggle('text-on-accent', on);
      t.classList.toggle('bg-surface', !on);
      root.querySelector('#' + t.getAttribute('aria-controls')).hidden = !on;
      if (on && focus) t.focus();
    });
    onChange(mode);
  }
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => select(t.dataset.mode));
    t.addEventListener('keydown', (e) => {
      const target = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (target === undefined) return;
      e.preventDefault();
      select(tabs[(target + tabs.length) % tabs.length].dataset.mode, true);
    });
  });
  select(initial);
  return select;
}

const PERF_FIELDS = {
  atmMbar: { label: 'Atmospheric pressure', unit: 'mbar' },
  inletBarG: { label: 'Inlet pressure', unit: 'bar g' },
  exhaustBarG: { label: 'Exhaust pressure', unit: 'bar g', signed: true },
  rpm: { label: 'Speed', unit: 'rev/min' },
  loadN: { label: 'Brake load', unit: 'N' },
  condensateCm3: { label: 'Condensate', unit: 'cm³' },
  condensateTimeS: { label: 'Collection time', unit: 's' },
};
const SINGLE_KEYS = ['atmMbar', 'inletBarG', 'exhaustBarG', 'rpm', 'loadN', 'condensateCm3', 'condensateTimeS'];
const TEST_KEYS = ['atmMbar', 'inletBarG', 'exhaustBarG', 'condensateCm3', 'condensateTimeS'];
const MY_TEST_ID = 'mine';

const fmt = (v, dp) => (typeof v === 'number' && Number.isFinite(v) ? v.toFixed(dp) : '—');
const parseNum = (str) => {
  const t = String(str ?? '').trim();
  if (t === '') return { value: null, valid: true };
  const n = Number(t);
  return Number.isFinite(n) ? { value: n, valid: true } : { value: null, valid: false };
};
const strOf = (n) => (n === null || n === undefined ? '' : String(n));

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

let fieldSeq = 0;
// A labelled text input for one number. type=text keeps partial entries like "-" or "1." while typing.
function numberField(key, value, onInput) {
  const f = PERF_FIELDS[key];
  const id = `perf-field-${++fieldSeq}`;
  const wrap = el('div', 'flex flex-col gap-1');
  const label = el('label', 'text-sm text-muted');
  label.htmlFor = id;
  label.append(f.label + ' ', el('span', 'font-mono text-xs', `(${f.unit})`));
  const input = el('input', 'h-12 w-full min-w-0 px-3 bg-bg border border-line rounded-[2px] font-mono text-[17px] text-fg focus:border-accent focus-visible:outline-solid focus-visible:outline-2 focus-visible:outline-offset-0 focus-visible:outline-accent aria-[invalid=true]:border-accent-ink');
  input.id = id;
  input.type = 'text';
  input.autocomplete = 'off';
  if (!f.signed) input.inputMode = 'decimal';   // the decimal keypad has no minus sign on some phones
  input.value = value;
  input.addEventListener('input', () => {
    input.setAttribute('aria-invalid', String(!parseNum(input.value).valid));
    onInput(input.value);
  });
  input.setAttribute('aria-invalid', String(!parseNum(value).valid));
  wrap.append(label, input);
  return wrap;
}

function manualTest(id) { return MANUAL_DATA.find((t) => t.id === id); }

function manualTestState(t) {
  const fields = {};
  for (const k of TEST_KEYS) fields[k] = strOf(t[k]);
  return { fields, rows: t.rows.map((r) => ({ rpm: strOf(r.rpm), loadN: strOf(r.loadN) })) };
}

function blankTestState() {
  return {
    fields: { atmMbar: '1013', inletBarG: '', exhaustBarG: '', condensateCm3: '200', condensateTimeS: '' },
    rows: Array.from({ length: 6 }, () => ({ rpm: '', loadN: '' })),

}

function renderErrata(box, notes) {
  box.replaceChildren();
  box.hidden = notes.length === 0;
  if (!notes.length) return;
  box.append(el('p', 'font-display font-semibold uppercase tracking-wide text-steel', 'Differs from the printed manual'));
  const list = el('ul', 'mt-2 flex flex-col gap-2 list-disc pl-5 leading-normal');
  notes.forEach((n) => list.append(el('li', '', n)));
  box.append(list);
}

function initTurbineTool(root) {
  const q = (sel) => root.querySelector(sel);
  const cleanups = [];
  let destroyed = false;

  // ----- Mode tabs -----
  function onMode(mode) {
    Store.set('perf:mode', mode);
    if (mode === 'table') ensureCharts();
  }

  // ----- Single reading -----
  let single = Store.get('perf:single', null) || structuredClone(SINGLE_EXAMPLE);

  function singleNumbers() {
    const out = {}; let invalid = false;
    for (const k of SINGLE_KEYS) {
      const p = parseNum(single.values[k]);
      out[k] = p.value;
      if (!p.valid) invalid = true;
    }
    return { nums: out, invalid };
  }

  function renderSingleFields() {
    const box = q('[data-role="single-fields"]');
    box.replaceChildren(...SINGLE_KEYS.map((k) => numberField(k, single.values[k], (v) => {
      single.values[k] = v;
      single.source = null;
      Store.set('perf:single', single);
      updateSingle();
    })));
  }

  function resultRow(label, value, unit, emphasis) {
    const row = el('div', 'flex justify-between items-baseline gap-3 px-3 py-2.5 bg-bg');
    row.append(el('dt', 'text-sm text-muted', label));
    const dd = el('dd', 'font-mono text-[19px] font-semibold text-right ' + (emphasis ? 'text-accent-ink' : ''), value);
    dd.append(' ', el('span', 'text-sm font-normal text-muted', unit));
    row.append(dd);
    return row;
  }

  function step(title, lines, missing) {
    const li = el('li', 'border-l-2 border-line pl-3');
    li.append(el('p', 'font-display font-semibold uppercase tracking-wide text-[15px]', title));
    if (missing.length) {
      li.append(el('p', 'mt-1 text-sm text-muted', 'Enter ' + missing.join(', ') + ' to see this step.'));
    } else {
      lines.forEach((l, i) => li.append(el('p', 'mt-0.5 font-mono text-sm break-words ' + (i === lines.length - 1 ? 'font-semibold text-accent-ink' : ''), l)));
    }
    return li;
  }

  function updateSingle() {
    const { nums: n, invalid } = singleNumbers();
    const r = Perf.computeReading(n);
    const v = single.values;
    const label = (k) => PERF_FIELDS[k].label.toLowerCase();
    const miss = (...keys) => keys.filter((k) => n[k] === null).map(label);

    q('[data-role="single-source"]').textContent = single.source
      ? `Manual reading ${single.source} (p.46)`
      : 'Your readings';
    renderErrata(q('[data-role="single-errata"]'),
      single.source ? manualTest(single.source[0]).errata.filter((e) => e.includes(single.source)) : []);

    q('[data-role="single-results"]').replaceChildren(
      resultRow('Inlet pressure (abs)', fmt(r.inletAbs, 3), 'bar'),
      resultRow('Exhaust pressure (abs)', fmt(r.exhaustAbs, 3), 'bar'),
      resultRow('Brake torque', fmt(r.torque, 4), 'N·m'),
      resultRow('Shaft power', fmt(r.power, 1), 'W', true),
      resultRow('Steam flow', r.flow === null ? '—' : (r.flow * 1000).toFixed(3), '×10⁻³ kg/s'),
      resultRow('Specific steam consumption', fmt(r.ssc, 1), 'kg/kWh', true),
    );

    const warnings = [];
    if (invalid) warnings.push('Some entries aren’t numbers — check the highlighted boxes.');
    if (r.exhaustAbs !== null && r.exhaustAbs <= 0) warnings.push('Exhaust pressure is at or below absolute zero — a gauge reading can’t be lower than −(atmospheric pressure).');
    if (r.inletAbs !== null && r.exhaustAbs !== null && r.inletAbs <= r.exhaustAbs) warnings.push('Inlet pressure should be higher than exhaust pressure.');
    if (n.rpm !== null && n.rpm > S220.overspeedRpm) warnings.push('Speed is above the 40 000 rev/min overspeed trip — check the reading.');
    if (n.loadN !== null && n.loadN < 0) warnings.push('Brake load is negative — re-zero the load indicator (manual p.31).');
    const warnBox = q('[data-role="single-warnings"]');
    warnBox.textContent = warnings.join(' ');
    warnBox.hidden = warnings.length === 0;

    const kgs = r.flow;
    q('[data-role="single-steps"]').replaceChildren(
      step('1. Absolute inlet pressure', [
        'p₁ = p₁(gauge) + p(atm)',
        `p₁ = ${v.inletBarG} + ${v.atmMbar}/1000`,
        `p₁ = ${fmt(r.inletAbs, 3)} bar`,
      ], miss('inletBarG', 'atmMbar')),
      step('2. Absolute exhaust pressure', [
        'p₂ = p₂(gauge) + p(atm)',
        `p₂ = ${v.exhaustBarG} + ${v.atmMbar}/1000`,
        `p₂ = ${fmt(r.exhaustAbs, 3)} bar`,
      ], miss('exhaustBarG', 'atmMbar')),
      step('3. Brake torque', [
        'T = F × r   (r = 0.023 m, brake effective radius)',
        `T = ${v.loadN} × 0.023`,
        `T = ${fmt(r.torque, 4)} N·m`,
      ], miss('loadN')),
      step('4. Shaft power', [
        'P = T × 2πN / 60',
        `P = ${fmt(r.torque, 4)} × 2π × ${v.rpm} / 60`,
        `P = ${fmt(r.power, 1)} W`,
      ], miss('loadN', 'rpm')),
      step('5. Steam flow', [
        'ṁ = V / t   (1 cm³ of condensate = 1 g)',
        `ṁ = ${v.condensateCm3} g / ${v.condensateTimeS} s`,
        `ṁ = ${kgs === null ? '—' : (kgs * 1000).toFixed(3)} g/s = ${kgs === null ? '—' : (kgs * 1000).toFixed(3)}×10⁻³ kg/s`,
      ], miss('condensateCm3', 'condensateTimeS')),
      step('6. Specific steam consumption', [
        'SSC = ṁ × 3600 / P   (P in kW)',
        `SSC = ${kgs === null ? '—' : (kgs * 1000).toFixed(3)}×10⁻³ × 3600 / ${r.power === null ? '—' : (r.power / 1000).toFixed(4)}`,
        `SSC = ${fmt(r.ssc, 1)} kg/kWh`,
      ], miss('condensateCm3', 'condensateTimeS', 'loadN', 'rpm')),
    );
  }

  q('[data-action="single-example"]').addEventListener('click', () => {
    single = structuredClone(SINGLE_EXAMPLE);
    Store.set('perf:single', single);
    renderSingleFields();
    updateSingle();
  });
  q('[data-action="single-clear"]').addEventListener('click', () => {
    single = { values: Object.fromEntries(SINGLE_KEYS.map((k) => [k, ''])), source: null };
    single.values.atmMbar = '1013';
    single.values.condensateCm3 = '200';
    Store.set('perf:single', single);
    renderSingleFields();
    updateSingle();
  });

  // ----- Test table -----
  const edited = Store.get('perf:tests', {});
  let testId = Store.get('perf:test', 'B');
  if (testId !== MY_TEST_ID && !manualTest(testId)) testId = 'B';
  let test;

  const select = q('[data-role="test-select"]');
  MANUAL_DATA.forEach((t) => {
    const o = el('option', '', `Manual test ${t.id} — exp. ${t.experiment}: inlet ${t.inletBarG} bar g, exhaust ${t.exhaustBarG} bar g`);
    o.value = t.id;
    select.append(o);
  });
  const mine = el('option', '', 'My readings');
  mine.value = MY_TEST_ID;
  select.append(mine);

  function loadTest(id) {
    testId = id;
    Store.set('perf:test', id);
    select.value = id;
    test = structuredClone(edited[id] || (id === MY_TEST_ID ? blankTestState() : manualTestState(manualTest(id))));
    renderTest();
  }

  function saveTest() {
    edited[testId] = test;
    Store.set('perf:tests', edited);
    renderTestStatus();
  }

  function rowLabel(i) { return testId === MY_TEST_ID ? String(i + 1) : `${testId}.${i + 1}`; }

  function testNumbers() {
    const f = {};
    for (const k of TEST_KEYS) f[k] = parseNum(test.fields[k]).value;
    return f;
  }

  function computeRows() {
    const f = testNumbers();
    return test.rows.map((row, i) => ({
      label: rowLabel(i),
      rpm: parseNum(row.rpm).value,
      loadN: parseNum(row.loadN).value,
      ...Perf.computeReading({ ...f, rpm: parseNum(row.rpm).value, loadN: parseNum(row.loadN).value }),
    }));
  }

  function renderTestStatus() {
    const t = manualTest(testId);
    q('[data-role="test-status"]').textContent = t
      ? `Manual p.${t.page} · ${edited[testId] ? 'edited on this device' : 'as published' + (t.errata.length ? ' (errata corrected)' : '')}`
      : 'Your own readings · saved on this device';
    q('[data-action="test-reset"]').textContent = t ? 'Reset to manual data' : 'Clear readings';
  }

  function renderTest() {
    renderTestStatus();
    q('[data-role="test-fields"]').replaceChildren(...TEST_KEYS.map((k) => numberField(k, test.fields[k], (v) => {
      test.fields[k] = v;
      saveTest();
      updateTestResults();
    })));
    const t = manualTest(testId);
    renderErrata(q('[data-role="test-errata"]'), t ? t.errata : []);

    const body = q('[data-role="test-rows"]');
    body.replaceChildren();
    test.rows.forEach((row, i) => {
      const li = el('li', 'grid grid-cols-[2.75rem_minmax(0,1fr)_minmax(0,1fr)_2.75rem] sm:grid-cols-[3rem_8rem_8rem_minmax(0,1fr)_minmax(0,1fr)_minmax(0,1fr)_2.75rem] items-center gap-x-2 gap-y-1 py-2 border-t border-line');
      li.dataset.row = rowLabel(i);
      li.append(el('span', 'font-mono text-sm text-muted', rowLabel(i)));
      for (const key of ['rpm', 'loadN']) {
        const input = el('input', 'h-11 w-full min-w-0 px-2 bg-bg border border-line rounded-[2px] font-mono text-base text-fg focus:border-accent focus-visible:outline-solid focus-visible:outline-2 focus-visible:outline-offset-0 focus-visible:outline-accent aria-[invalid=true]:border-accent-ink');
        input.type = 'text';
        input.inputMode = 'decimal';
        input.autocomplete = 'off';
        input.value = row[key];
        input.setAttribute('aria-label', `${PERF_FIELDS[key].label}, row ${rowLabel(i)}`);
        input.setAttribute('aria-invalid', String(!parseNum(row[key]).valid));
        input.addEventListener('input', () => {
          row[key] = input.value;
          input.setAttribute('aria-invalid', String(!parseNum(input.value).valid));
          saveTest();
          updateTestResults();
        });
        li.append(input);
      }
      const btn = el('button', 'sm:order-2 w-11 h-11 inline-flex items-center justify-center text-muted hover:text-fg border border-transparent hover:border-line rounded-[2px] disabled:opacity-40');
      btn.type = 'button';
      btn.setAttribute('aria-label', `Remove row ${rowLabel(i)}`);
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      btn.disabled = test.rows.length <= 1;
      btn.addEventListener('click', () => {
        test.rows.splice(i, 1);
        saveTest();
        renderTest();
      });
      li.append(btn);
      // Results: under the inputs on phones (labelled inline), in their own columns from sm up.
      const out = el('div', 'col-start-2 col-span-3 sm:col-start-auto sm:col-span-3 sm:order-1 grid grid-cols-3 gap-2');
      for (const [key, name, unit] of [['torque', 'Torque', 'N·m'], ['power', 'Power', 'W'], ['ssc', 'SSC', 'kg/kWh']]) {
        const cell = el('p', 'font-mono text-sm sm:text-right leading-tight');
        cell.append(el('span', 'block sm:sr-only text-xs text-muted', name));
        const value = el('span', 'tabular-nums', '—');
        value.dataset.out = key;
        cell.append(value, el('span', 'sm:sr-only text-xs text-muted', ' ' + unit));
        out.append(cell);
      }
      li.append(out);
      body.append(li);
    });
    updateTestResults();
  }

  function updateTestResults() {
    const rows = computeRows();
    const items = q('[data-role="test-rows"]').children;
    rows.forEach((r, i) => {
      items[i].querySelector('[data-out="torque"]').textContent = fmt(r.torque, 4);
      items[i].querySelector('[data-out="power"]').textContent = fmt(r.power, 1);
      items[i].querySelector('[data-out="ssc"]').textContent = fmt(r.ssc, 1);
    });
    const flow = rows.length ? rows[0].flow : null;
    q('[data-role="test-flow"]').textContent = flow === null
      ? 'Steam flow ṁ: enter condensate volume and time.'
      : `Steam flow ṁ = ${(flow * 1000).toFixed(3)}×10⁻³ kg/s (one value per test)`;
    updateCharts(rows);
  }

  select.addEventListener('change', () => loadTest(select.value));
  q('[data-action="row-add"]').addEventListener('click', () => {
    test.rows.push({ rpm: '', loadN: '' });
    saveTest();
    renderTest();
    const inputs = q('[data-role="test-rows"]').lastElementChild.querySelectorAll('input');
    inputs[0].focus();
  });
  q('[data-action="test-reset"]').addEventListener('click', () => {
    if (testId === MY_TEST_ID && !window.confirm('Clear all of your readings for this test?')) return;
    delete edited[testId];
    Store.set('perf:tests', edited);
    loadTest(testId);
  });
  q('[data-action="test-csv"]').addEventListener('click', () => {
    const f = test.fields;
    const rows = computeRows();
    const name = testId === MY_TEST_ID ? 'My readings' : `Manual test ${testId}`;
    const round = (v, dp) => (v === null ? null : Number(v.toFixed(dp)));
    Csv.download(`s220-${testId === MY_TEST_ID ? 'my-readings' : 'test-' + testId}.csv`, [
      ['S220 turbine performance', name],
      ['Atmospheric pressure (mbar)', f.atmMbar],
      ['Inlet pressure (bar g)', f.inletBarG],
      ['Exhaust pressure (bar g)', f.exhaustBarG],
      ['Condensate (cm3)', f.condensateCm3],
      ['Collection time (s)', f.condensateTimeS],
      ['Steam flow (kg/s)', round(rows[0] ? rows[0].flow : null, 7)],
      [],
      ['Row', 'Speed (rev/min)', 'Brake load (N)', 'Torque (N·m)', 'Shaft power (W)', 'SSC (kg/kWh)'],
      ...rows.map((r) => [r.label, r.rpm, r.loadN, round(r.torque, 5), round(r.power, 2), round(r.ssc, 1)]),
    ]);
  });

  // ----- Charts (Chart.js, loaded on demand; the table carries every value if it fails) -----
  const CHARTS = [
    { key: 'torque', unit: 'N·m', dp: 4 },
    { key: 'power', unit: 'W', dp: 1 },
    { key: 'ssc', unit: 'kg/kWh', dp: 1 },
  ];
  const charts = {};
  let chartsRequested = false;

  function chartColors() {
    return { series: cssVar('--series'), surface: cssVar('--surface'), line: cssVar('--line'), muted: cssVar('--muted'), fg: cssVar('--fg') };
  }

  function chartOptions(spec, c) {
    const axis = (title) => ({
      title: { display: !!title, text: title, color: c.muted, font: { family: 'Barlow', size: 13 } },
      ticks: { color: c.muted, font: { family: 'JetBrains Mono', size: 11 }, maxTicksLimit: 6 },
      grid: { color: c.line },
      border: { color: c.line },
    });
    return {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'nearest', intersect: false, axis: 'x' },
      scales: {
        x: { type: 'linear', ...axis('Speed (rev/min)') },
        y: { beginAtZero: true, ...axis('') },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: c.surface, titleColor: c.fg, bodyColor: c.fg, borderColor: c.line, borderWidth: 1,
          displayColors: false,
          titleFont: { family: 'JetBrains Mono' }, bodyFont: { family: 'JetBrains Mono' },
          callbacks: {
            title: (items) => `${items[0].raw.label} · ${items[0].raw.x} rev/min`,
            label: (item) => `${item.raw.y.toFixed(spec.dp)} ${spec.unit}`,
          },
        },
      },
    };
  }

  function datasetStyle(c) {
    return {
      borderColor: c.series, backgroundColor: c.series,
      pointBackgroundColor: c.series, pointBorderColor: c.surface, pointBorderWidth: 2,
      pointRadius: 5, pointHoverRadius: 7, pointHitRadius: 14, borderWidth: 2, tension: 0,
    };
  }

  function points(rows, key) {
    return rows.filter((r) => r.rpm !== null && r[key] !== null)
      .map((r) => ({ x: r.rpm, y: r[key], label: r.label }))
      .sort((a, b) => a.x - b.x);
  }

  function updateCharts(rows) {
    for (const spec of CHARTS) {
      const chart = charts[spec.key];
      if (!chart) continue;
      chart.data.datasets[0].data = points(rows, spec.key);
      chart.update('none');
    }
  }

  function restyleCharts() {
    const c = chartColors();
    for (const spec of CHARTS) {
      const chart = charts[spec.key];
      if (!chart) continue;
      chart.options = chartOptions(spec, c);
      Object.assign(chart.data.datasets[0], datasetStyle(c));
      chart.update('none');
    }
  }

  function ensureCharts() {
    if (chartsRequested) return;
    chartsRequested = true;
    const status = q('[data-role="charts-status"]');
    status.textContent = 'Loading charts…';
    status.hidden = false;
    Libs.load(CHART_LIB_URL).then(() => {
      if (destroyed) return;
      status.hidden = true;
      const c = chartColors();
      const rows = computeRows();
      for (const spec of CHARTS) {
        charts[spec.key] = new window.Chart(q(`[data-chart="${spec.key}"]`), {
          type: 'line',
          data: { datasets: [{ data: points(rows, spec.key), ...datasetStyle(c) }] },
          options: chartOptions(spec, c),
        });
      }
    }, () => {
      if (destroyed) return;
      chartsRequested = false;   // allow a retry next time the tab is opened
      status.textContent = 'Charts couldn’t load (no internet connection?). Every value is in the table above.';
    });
  }

  window.addEventListener('themechange', restyleCharts);
  cleanups.push(() => window.removeEventListener('themechange', restyleCharts));

  // ----- Start -----
  renderSingleFields();
  updateSingle();
  loadTest(testId);
  const selectTab = wireTabs(root, Store.get('perf:mode', 'single') === 'table' ? 'table' : 'single', onMode);

  return {
    destroy() {
      destroyed = true;
      Object.values(charts).forEach((ch) => ch.destroy());
      cleanups.forEach((fn) => fn());
    },
  };
}

// Ideal Rankine cycle states (+ actual turbine exit for a given isentropic efficiency).
function rankineCycle(pHigh, pLow, etaS) {
  const lo = Steam.sat(pLow), hi = Steam.sat(pHigh);
  const s1 = { p: pLow, T: lo.T, s: lo.sf, h: lo.hf, x: 0 };
  const st2 = Steam.ps(pHigh, lo.sf);
  const s2 = { p: pHigh, T: st2.T, s: st2.s, h: st2.h, x: null };
  const s3 = { p: pHigh, T: hi.T, s: hi.sg, h: hi.hg, x: 1 };
  const st4s = Steam.ps(pLow, hi.sg);
  const s4s = { p: pLow, T: st4s.T, s: st4s.s, h: st4s.h, x: st4s.x };
  const st4 = Steam.ph(pLow, s3.h - etaS * (s3.h - s4s.h));
  const s4 = { p: pLow, T: st4.T, s: st4.s, h: st4.h, x: st4.x };
  const wTurbine = s3.h - s4s.h, wPump = s2.h - s1.h, qIn = s3.h - s2.h;
  return { lo, hi, s1, s2, s3, s4s, s4, wTurbine, wPump, qIn, eta: (wTurbine - wPump) / qIn };
}

// Saturation dome: liquid line up to the critical point, then the vapour line back down.
function saturationDome() {
  const temps = [];
  for (let T = 0.01; T < 300; T += 10) temps.push(T);
  for (let T = 300; T < 373.9; T += 4) temps.push(T);
  temps.push(373.9);
  const liquid = temps.map((T) => ({ s: Steam.tx(T, 0).s, T }));
  const vapour = temps.slice().reverse().map((T) => ({ s: Steam.tx(T, 1).s, T }));
  return liquid.concat(vapour);
}

function tsDiagram(c) {
  // Zoomed to the cycle's temperature band; the dome is clipped at the plot edges.
  const W = 340, H = 270, L = 42, R = 328, Tp = 12, B = 230;
  const sMax = 9, TMin = 40, TMax = 180;
  const X = (s) => L + (s / sMax) * (R - L);
  const Y = (T) => B - ((T - TMin) / (TMax - TMin)) * (B - Tp);
  const path = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.s).toFixed(1)} ${Y(p.T).toFixed(1)}`).join(' ');

  let grid = '';
  for (let s = 0; s <= sMax; s += 1) grid += `<line x1="${X(s)}" y1="${Tp}" x2="${X(s)}" y2="${B}" class="stroke-line stroke-[0.75]"/><text x="${X(s)}" y="${B + 13}" text-anchor="middle" class="fill-muted font-mono text-[9px]">${s}</text>`;
  for (let T = TMin; T <= TMax; T += 20) grid += `<line x1="${L}" y1="${Y(T)}" x2="${R}" y2="${Y(T)}" class="stroke-line stroke-[0.75]"/><text x="${L - 5}" y="${Y(T) + 3}" text-anchor="end" class="fill-muted font-mono text-[9px]">${T}</text>`;

  // Boiler line: compressed liquid along the high-pressure isobar, then boiling at constant T.
  const heating = [c.s2];
  for (let i = 1; i < 12; i++) {
    const T = c.s2.T + (c.hi.T - 0.05 - c.s2.T) * (i / 12);
    const st = Steam.pt(c.hi.p, T);
    heating.push({ s: st.s, T });
  }
  heating.push({ s: c.hi.sf, T: c.hi.T }, c.s3);

  const seg = (id, d, extra = '') => `<path data-seg="${id}" d="${d}" fill="none" class="stroke-series stroke-[2.5] transition-opacity duration-200 data-[state=dim]:opacity-20 data-[state=on]:stroke-[4]" ${extra}/>`;
  const pt = (st, label, dx, dy, anchor = 'start') =>
    `<g><circle cx="${X(st.s)}" cy="${Y(st.T)}" r="4" class="fill-series stroke-surface stroke-2"><title>State ${label}: ${st.T.toFixed(1)} °C, s = ${st.s.toFixed(3)} kJ/kg·K</title></circle>
     <text x="${X(st.s) + dx}" y="${Y(st.T) + dy}" text-anchor="${anchor}" class="fill-fg font-mono text-[11px] font-semibold">${label}</text></g>`;

  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto block" role="img" aria-labelledby="rk-ts-title">
    <title id="rk-ts-title">Temperature–entropy diagram: saturation dome with the ideal Rankine cycle between ${c.hi.p} and ${c.lo.p} bar abs. Values are in the state-point table.</title>
    <defs><clipPath id="rk-ts-clip"><rect x="${L}" y="${Tp}" width="${R - L}" height="${B - Tp}"/></clipPath></defs>
    ${grid}
    <path d="${path(saturationDome())}" fill="none" clip-path="url(#rk-ts-clip)" class="stroke-muted stroke-[1.25]"/>
    <text x="${X(1.72)}" y="${Y(160)}" text-anchor="end" class="fill-muted font-sans text-[10px]">sat. liquid</text>
    <text x="${X(7.75)}" y="${Y(52)}" text-anchor="end" class="fill-muted font-sans text-[10px]">sat. vapour</text>
    ${seg('pump', path([c.s1, c.s2]))}
    ${seg('boiler', path(heating))}
    ${seg('turbine', path([c.s3, c.s4s]))}
    ${seg('condenser', path([c.s4s, c.s1]))}
    ${seg('actual', path([c.s3, c.s4]), 'stroke-dasharray="5 4"')}
    <text x="${X(4)}" y="${Y(c.hi.T) - 6}" text-anchor="middle" class="fill-muted font-mono text-[9px]">${c.hi.p} bar · ${c.hi.T.toFixed(1)} °C</text>
    <text x="${X(4)}" y="${Y(c.lo.T) - 6}" text-anchor="middle" class="fill-muted font-mono text-[9px]">${c.lo.p} bar · ${c.lo.T.toFixed(1)} °C</text>
    ${pt(c.s1, '1', 4, 15)}
    ${pt(c.s2, '2', -7, -2, 'end')}
    ${pt(c.s3, '3', 6, -4)}
    ${pt(c.s4s, '4s', -6, 14, 'end')}
    ${pt(c.s4, '4', 6, 14)}
    <text x="${(L + R) / 2}" y="${H - 2}" text-anchor="middle" class="fill-muted font-sans text-[10px]">Specific entropy s (kJ/kg·K)</text>
    <text x="10" y="${(Tp + B) / 2}" text-anchor="middle" transform="rotate(-90 10 ${(Tp + B) / 2})" class="fill-muted font-sans text-[10px]">Temperature (°C)</text>
  </svg>`;
}

function initRankineLesson(root) {
  const q = (sel) => root.querySelector(sel);
  const cleanups = [];

  // ----- Schematics: one interactive (Explore), one for the walkthrough -----
  q('[data-role="schematic-explore"]').innerHTML = rankineSchematic(true);
  q('[data-role="schematic-walk"]').innerHTML = rankineSchematic(false);
  q('[data-role="legend"]').innerHTML = [
    ['stroke-accent-ink stroke-[4]', 'Steam'],
    ['stroke-steel stroke-[4]', 'Water (feed & condensate)'],
    ['stroke-steel stroke-[2]', 'Cooling water (thin line)'],
  ].map(([cls, text]) => `<li class="flex items-center gap-2"><svg width="22" height="8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" class="${cls}"/></svg>${text}</li>`).join('');

  // ----- Flow animation (pausable; paused by default when the OS asks for reduced motion) -----
  let flowing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const flowBtn = q('[data-action="flow-toggle"]');
  function renderFlow() {
    root.querySelectorAll('[data-flow]').forEach((p) => p.classList.toggle('animate-flow', flowing));
    flowBtn.textContent = flowing ? 'Pause flow' : 'Show flow';
    flowBtn.setAttribute('aria-pressed', String(flowing));
  }
  flowBtn.addEventListener('click', () => { flowing = !flowing; renderFlow(); });
  renderFlow();

  // ----- Explore: tap a component -----
  const info = q('[data-role="comp-info"]');
  const exploreSvg = q('[data-role="schematic-explore"]');
  function showComponent(id) {
    exploreSvg.querySelectorAll('[data-comp][role="button"]').forEach((g) => {
      const on = g.dataset.comp === id;
      g.dataset.state = on ? 'on' : '';
      g.setAttribute('aria-pressed', String(on));
    });
    const c = RANKINE_COMPONENTS[id];
    info.replaceChildren(
      el('p', 'font-mono text-xs uppercase text-steel', c.process),
      el('h2', 'mt-1 font-display font-semibold text-2xl uppercase tracking-wide', c.name),
      el('p', 'font-mono text-xs text-muted', c.part),
      el('p', 'mt-2 text-[15px] leading-normal', c.role),
    );
    const list = el('ul', 'mt-2 flex flex-col gap-1.5 list-disc pl-5 text-[15px] leading-normal text-muted');
    c.facts.forEach((f) => list.append(el('li', '', f)));
    info.append(list);
  }
  info.replaceChildren(
    el('h2', 'font-display font-semibold text-xl uppercase tracking-wide', 'Pick a component'),
    el('p', 'mt-2 text-[15px] leading-normal text-muted', 'Tap any part of the loop — boiler, throttle, turbine, condenser, cooling water, feed tank or pump — to see what it does on the S220 and which Rankine process it belongs to.'),
  );
  exploreSvg.querySelectorAll('[data-comp][role="button"]').forEach((g) => {
    g.addEventListener('click', () => showComponent(g.dataset.comp));
    g.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showComponent(g.dataset.comp); }
    });
  });

  // ----- Walkthrough -----
  let stepIndex = 0;
  const dots = q('[data-role="step-dots"]');
  RANKINE_STEPS.forEach((st, i) => {
    const li = el('li');
    const b = el('button', 'w-7 h-7 flex items-center justify-center rounded-full');
    b.append(el('span', 'w-3 h-3 rounded-full border border-fg'));
    b.type = 'button';
    b.setAttribute('aria-label', `Step ${i + 1}: ${st.title}`);
    b.addEventListener('click', () => showStep(i, true));
    li.append(b);
    dots.append(li);
  });

  function highlight(container, attr, ids) {
    container.querySelectorAll(`[${attr}]`).forEach((n) => {
      const id = n.getAttribute(attr);
      n.dataset.state = ids === null ? '' : ids.includes(id) ? 'on' : 'dim';
    });
  }

  function showStep(i, focus) {
    stepIndex = i;
    const st = RANKINE_STEPS[i];
    q('[data-role="step-count"]').textContent = `Step ${i + 1} of ${RANKINE_STEPS.length}`;
    q('[data-role="step-title"]').textContent = st.title;
    q('[data-role="step-text"]').replaceChildren(...st.text.map((t) => el('p', '', t)));
    q('[data-action="step-prev"]').disabled = i === 0;
    q('[data-action="step-next"]').disabled = i === RANKINE_STEPS.length - 1;
    [...dots.querySelectorAll('button')].forEach((b, j) => {
      b.firstChild.classList.toggle('bg-accent', j === i);
      b.firstChild.classList.toggle('border-accent', j === i);
      if (j === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    const all = i === 0;
    highlight(q('[data-role="schematic-walk"]'), 'data-comp', all ? null : st.comps);
    highlight(q('[data-role="ts"]'), 'data-seg', all ? null : st.segs);
    if (focus) q('[data-role="step-title"]').focus();
  }
  q('[data-action="step-prev"]').addEventListener('click', () => showStep(Math.max(0, stepIndex - 1)));
  q('[data-action="step-next"]').addEventListener('click', () => showStep(Math.min(RANKINE_STEPS.length - 1, stepIndex + 1)));

  // ----- T–s diagram + state table (needs the steam library) -----
  const P_HIGH = 5.6, P_LOW = 0.5, ETA_S = 0.134;   // manual experiment 3 (pp.63–67)
  function renderTs() {
    const box = q('[data-role="ts"]');
    const table = q('[data-role="ts-table"]');
    const summary = q('[data-role="ts-summary"]');
    if (Steam.status !== 'ready') {
      const msg = Steam.status === 'loading' ? 'Loading steam tables…' : 'The T–s diagram needs the steam tables, which couldn’t load. Reconnect and reload the page.';
      box.replaceChildren(el('p', 'text-[15px] text-muted', msg));
      table.replaceChildren();
      summary.textContent = '';
      return;
    }
    const c = rankineCycle(P_HIGH, P_LOW, ETA_S);
    // Dryness fraction only exists inside the dome; single-phase states say so in their description.
    const xLabel = (st) => (typeof st.x === 'number' ? fmt(st.x, 3) : '—');
    const phase = (st) => (typeof st.x === 'number' ? '' : st.T > Steam.sat(st.p).T + 0.01 ? ' — superheated' : ' — liquid');
    box.innerHTML = tsDiagram(c);
    const rows = [
      ['1', 'Saturated water leaving the condenser', c.s1],
      ['2', 'Compressed water leaving the pump', c.s2],
      ['3', 'Saturated steam leaving the boiler', c.s3],
      ['4s', 'Turbine exit, ideal (isentropic)', c.s4s],
      ['4', `Turbine exit, actual (η = ${Math.round(ETA_S * 100)} %)${phase(c.s4)}`, c.s4],
    ];
    // One entry per state: description, then the five properties (fits a phone without scrolling).
    const props = [['p', 'bar', (st) => fmt(st.p, 2)], ['T', '°C', (st) => fmt(st.T, 1)], ['h', 'kJ/kg', (st) => fmt(st.h, 1)],
      ['s', 'kJ/kg·K', (st) => fmt(st.s, 3)], ['x', '', xLabel]];
    table.replaceChildren(el('ol', 'flex flex-col'));
    rows.forEach(([n, where, st]) => {
      const li = el('li', 'py-2.5 border-t border-line first:border-t-0');
      const head = el('p', 'text-[15px]');
      head.append(el('span', 'font-mono font-semibold text-accent-ink mr-2', n), where);
      const dl = el('dl', 'mt-1.5 grid grid-cols-5 gap-2');
      for (const [sym, unit, get] of props) {
        const d = el('div', 'min-w-0');
        const dt = el('dt', 'text-xs text-muted', sym + ' ');
        if (unit) dt.append(el('span', 'font-mono text-[10px]', unit));
        d.append(dt, el('dd', 'font-mono text-sm', get(st)));
        dl.append(d);
      }
      li.append(head, dl);
      table.firstChild.append(li);
    });
    summary.textContent = `Ideal Rankine efficiency between these pressures: ${(c.eta * 100).toFixed(1)} % ` +
      `(turbine work ${c.wTurbine.toFixed(0)} kJ/kg, pump work ${c.wPump.toFixed(2)} kJ/kg, heat in ${c.qIn.toFixed(0)} kJ/kg). ` +
      'The S220 measures about 0.66 % (manual p.70): a 13 %-efficient turbine, heat losses, a low inlet pressure and an electric boiler rated on its full 6 kW.';
    showStep(stepIndex);
  }
  window.addEventListener('steamstatus', renderTs);
  cleanups.push(() => window.removeEventListener('steamstatus', renderTs));

  // ----- Quiz -----
  const quiz = q('[data-role="quiz"]');
  const answers = new Map();
  function renderScore() {
    const correct = [...answers.entries()].filter(([i, a]) => RANKINE_QUIZ[i].answer === a).length;
    q('[data-role="quiz-score"]').textContent = answers.size === RANKINE_QUIZ.length
      ? `Score: ${correct} / ${RANKINE_QUIZ.length}${correct === RANKINE_QUIZ.length ? ' — all correct.' : ''}`
      : `Answered ${answers.size} of ${RANKINE_QUIZ.length}`;
  }
  function renderQuiz() {
    answers.clear();
    quiz.replaceChildren(...RANKINE_QUIZ.map((item, qi) => {
      const li = el('li', 'bg-surface border border-line rounded-[2px] p-4');
      const fs = el('fieldset');
      const legend = el('legend', 'font-sans font-semibold text-[16px] leading-snug', `${qi + 1}. ${item.q}`);
      fs.append(legend);
      const opts = el('div', 'mt-3 flex flex-col gap-2');
      const feedback = el('div', 'mt-3 text-[15px] leading-normal');
      feedback.setAttribute('aria-live', 'polite');
      feedback.hidden = true;
      item.options.forEach((text, oi) => {
        const id = `rk-q${qi}-o${oi}`;
        const label = el('label', 'flex items-center gap-3 min-h-[44px] px-3 py-2 border border-line rounded-[2px] cursor-pointer has-[:checked]:border-accent has-[:disabled]:cursor-default');
        label.htmlFor = id;
        const input = el('input', 'w-5 h-5 accent-[var(--accent)] shrink-0');
        input.type = 'radio';
        input.name = `rk-q${qi}`;
        input.id = id;
        input.addEventListener('change', () => {
          answers.set(qi, oi);
          fs.querySelectorAll('input').forEach((x) => { x.disabled = true; });
          const right = oi === item.answer;
          const mark = (lbl, ok) => {
            lbl.classList.add(ok ? 'border-steel' : 'border-accent-ink');
            lbl.append(el('span', `ml-auto font-mono text-xs uppercase ${ok ? 'text-steel' : 'text-accent-ink'}`, ok ? '✓ correct answer' : '✗ your answer'));
          };
          mark(opts.children[item.answer], true);
          if (!right) mark(label, false);
          feedback.replaceChildren(
            el('p', `font-display font-semibold uppercase tracking-wide ${right ? 'text-steel' : 'text-accent-ink'}`, right ? 'Correct' : 'Not quite'),
            el('p', 'mt-1', item.explain),
          );
          feedback.hidden = false;
          renderScore();
        });
        label.append(input, el('span', 'text-[15px]', text));
        opts.append(label);
      });
      fs.append(opts, feedback);
      li.append(fs);
      return li;
    }));
    renderScore();
  }
  q('[data-action="quiz-reset"]').addEventListener('click', () => {
    renderQuiz();
    quiz.querySelector('input').focus();
  });

  // ----- Start -----
  renderQuiz();
  renderTs();
  showStep(0);
  wireTabs(root, 'explore', () => {});

  return {
    destroy() { cleanups.forEach((fn) => fn()); },
  };
}

// ===== Theme =====
document.getElementById('theme-toggle').addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('s220-theme', dark ? 'dark' : 'light'); } catch (e) {}
  window.dispatchEvent(new Event('themechange'));
});

// ===== Home: search + filters =====
const els = {
  home: document.getElementById('view-home'),
  item: document.getElementById('view-item'),
  search: document.getElementById('search'),
  typeFilters: document.getElementById('type-filters'),
  topicFilters: document.getElementById('topic-filters'),
  grid: document.getElementById('card-grid'),
  empty: document.getElementById('empty-state'),
  status: document.getElementById('results-status'),
  count: document.getElementById('item-count'),
  itemMeta: document.getElementById('item-meta'),
  itemTitle: document.getElementById('item-title'),
  mount: document.getElementById('item-mount'),
};

const homeState = { q: '', type: '', topic: '' };

const ALL_TOPICS = [...new Set(CATALOG.flatMap((e) => e.topics))].sort();

function matches(entry, state) {
  if (state.type && entry.type !== state.type) return false;
  if (state.topic && !entry.topics.includes(state.topic)) return false;
  const haystack = [entry.title, entry.summary, entry.code, ...entry.keywords, ...entry.topics].join(' ').toLowerCase();
  return state.q.toLowerCase().split(/\s+/).filter(Boolean).every((term) => haystack.includes(term));
}

function chip(label, pressed, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  b.setAttribute('aria-pressed', String(pressed));
  b.className = 'h-11 px-4 rounded-[2px] border font-display font-semibold text-[15px] uppercase tracking-wider ' +
    (pressed ? 'bg-accent border-accent text-on-accent' : 'bg-surface border-line text-fg hover:border-accent');
  b.addEventListener('click', onClick);
  return b;
}

function renderFilters() {
  els.typeFilters.replaceChildren(
    chip('All', homeState.type === '', () => setHomeState({ type: '' })),
    ...Object.entries(TYPE_LABELS).map(([type, label]) =>
      chip(label, homeState.type === type, () => setHomeState({ type: homeState.type === type ? '' : type })))
  );
  els.topicFilters.replaceChildren(
    ...ALL_TOPICS.map((topic) =>
      chip(topic, homeState.topic === topic, () => setHomeState({ topic: homeState.topic === topic ? '' : topic })))
  );
}

function card(entry) {
  const a = document.createElement('a');
  a.href = `#/${entry.type}/${entry.id}`;
  a.className = 'block bg-surface border border-line rounded-[2px] p-4 hover:border-accent focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent';

  const meta = document.createElement('div');
  meta.className = 'flex justify-between font-mono text-xs uppercase ' + (entry.type === 'tool' ? 'text-accent-ink' : 'text-steel');
  const kind = document.createElement('span');
  kind.textContent = entry.type;
  const code = document.createElement('span');
  code.textContent = entry.code;
  meta.append(kind, code);

  const title = document.createElement('h2');
  title.className = 'mt-1.5 font-display font-semibold text-2xl uppercase leading-tight';
  title.textContent = entry.title;

  const summary = document.createElement('p');
  summary.className = 'mt-1.5 text-[15px] leading-normal text-muted';
  summary.textContent = entry.summary;

  a.append(meta, title, summary);
  return a;
}

function renderGrid() {
  const results = CATALOG.filter((e) => matches(e, homeState));
  els.grid.replaceChildren(...results.map(card));
  els.empty.hidden = results.length > 0;
  els.count.textContent = '/ ' + String(results.length).padStart(2, '0');
  els.status.textContent = `${results.length} of ${CATALOG.length} items shown`;
}

function homeHash(state) {
  const params = new URLSearchParams();
  for (const key of ['q', 'type', 'topic']) if (state[key]) params.set(key, state[key]);
  const qs = params.toString();
  return qs ? `#/?${qs}` : '#/';
}

// Updates state, the URL (without a history entry or hashchange) and the view.
function setHomeState(patch) {
  Object.assign(homeState, patch);
  history.replaceState(null, '', homeHash(homeState));
  renderFilters();
  renderGrid();
}

els.search.addEventListener('input', () => setHomeState({ q: els.search.value }));
document.getElementById('clear-filters').addEventListener('click', () => {
  els.search.value = '';
  setHomeState({ q: '', type: '', topic: '' });
});

// ===== Router =====
let mounted = null;
let mountedEntry = null;

// Tells the student when an item's external library is still loading or failed to load.
function renderDepBanner() {
  const banner = document.getElementById('dep-banner');
  const needsSteam = mountedEntry && mountedEntry.needs.includes('steam');
  if (!needsSteam || Steam.status === 'ready') {
    banner.hidden = true;
    return;
  }
  banner.textContent = Steam.status === 'loading'
    ? 'Loading steam tables…'
    : 'The steam tables couldn’t load (no internet connection?). Anything that needs steam properties is unavailable — reconnect and reload the page.';
  banner.hidden = false;
}
window.addEventListener('steamstatus', renderDepBanner);

function unmount() {
  if (mounted) {
    mounted.destroy();
    mounted = null;
  }
  mountedEntry = null;
  els.mount.replaceChildren();
  renderDepBanner();
}

function showHome(params) {
  unmount();
  homeState.q = params.get('q') || '';
  homeState.type = TYPE_LABELS[params.get('type')] ? params.get('type') : '';
  homeState.topic = ALL_TOPICS.includes(params.get('topic')) ? params.get('topic') : '';
  els.search.value = homeState.q;
  renderFilters();
  renderGrid();
  els.item.hidden = true;
  els.home.hidden = false;
  document.title = 'S220 Lab Portal';
}

function showItem(entry) {
  unmount();
  document.getElementById('back-home').href = homeHash(homeState);   // return to the same search/filters
  els.itemMeta.className = 'mt-2 flex justify-between font-mono text-xs uppercase ' + (entry.type === 'tool' ? 'text-accent-ink' : 'text-steel');
  els.itemMeta.replaceChildren(
    Object.assign(document.createElement('span'), { textContent: entry.type }),
    Object.assign(document.createElement('span'), { textContent: entry.code })
  );
  els.itemTitle.textContent = entry.title;
  const fragment = document.getElementById(entry.templateId).content.cloneNode(true);
  els.mount.append(fragment);
  mountedEntry = entry;
  renderDepBanner();
  mounted = entry.init(els.mount) || { destroy() {} };
  els.home.hidden = true;
  els.item.hidden = false;
  document.title = `${entry.title} — S220 Lab Portal`;
  window.scrollTo(0, 0);
  els.itemTitle.focus();
}

function route() {
  const hash = location.hash.replace(/^#/, '') || '/';
  const [path, query = ''] = hash.split('?');
  const parts = path.split('/').filter(Boolean);

  if (parts.length === 0) return showHome(new URLSearchParams(query));

  if (parts.length === 2) {
    const entry = CATALOG.find((e) => e.type === parts[0] && e.id === parts[1]);
    if (entry) return showItem(entry);
  }

  // Unknown route: fall back to home and fix the URL.
  history.replaceState(null, '', '#/');
  showHome(new URLSearchParams());
}

window.addEventListener('hashchange', route);
route();
</script>
