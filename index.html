<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S220 Lab Portal</title>

<!-- Apply the saved (or OS) theme before first paint to avoid a flash. -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('s220-theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18/dist/index.global.js"></script>
<!-- Theme tokens live in CSS variables (below) so one Tailwind class covers both themes. -->
<style type="text/tailwindcss">
  @custom-variant dark (&:where(.dark, .dark *));
  @theme inline {
    --color-bg: var(--bg);
    --color-surface: var(--surface);
    --color-line: var(--line);
    --color-fg: var(--fg);
    --color-muted: var(--muted);
    --color-accent: var(--accent);
    --color-accent-ink: var(--accent-ink);
    --color-on-accent: var(--on-accent);
    --color-steel: var(--steel);
    --font-display: "Barlow Condensed", sans-serif;
    --font-sans: Barlow, sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }
</style>
<style>
  :root {
    --bg: #f4f5f6; --surface: #ffffff; --line: #d3d8dc;
    --fg: #16181a; --muted: #555d64;
    --accent: #f08a24; --accent-ink: #b35c00; --on-accent: #16181a;
    --steel: #2f6aa3;
    color-scheme: light;
  }
  .dark {
    --bg: #16181a; --surface: #202326; --line: #34383c;
    --fg: #eceff1; --muted: #a3aab0;
    --accent: #f08a24; --accent-ink: #f5a04f; --on-accent: #16181a;
    --steel: #7fb2e5;
    color-scheme: dark;
  }
</style>
</head>
<body class="bg-bg text-fg font-sans antialiased min-h-screen">

<header class="sticky top-0 z-10 bg-bg border-b-2 border-accent">
  <div class="max-w-5xl mx-auto flex items-center justify-between gap-3 px-4 py-3">
    <a href="#/" class="flex items-center gap-2.5 min-h-[44px]" aria-label="S220 Lab Portal home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="text-accent shrink-0" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 12l5-4M12 3v2M3 12h2M19 12h2"/></svg>
      <span class="font-display font-bold text-[22px] tracking-wider uppercase leading-none">S220 Lab Portal</span>
    </a>
    <button id="theme-toggle" type="button" class="w-11 h-11 flex items-center justify-center border border-line bg-surface rounded-[2px] hover:border-accent focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent" aria-label="Toggle light or dark theme">
      <svg class="dark:hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="hidden dark:block" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
    </button>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-5">

  <!-- Home view: catalogue with search + filters -->
  <section id="view-home" aria-labelledby="home-title">
    <h1 id="home-title" class="font-display font-semibold text-[34px] leading-tight uppercase tracking-wide">
      Tools &amp; lessons <span class="text-accent-ink" id="item-count"></span>
    </h1>

    <label class="mt-4 flex items-center gap-2 h-12 px-3 bg-surface border border-line rounded-[2px] focus-within:border-accent">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="text-muted shrink-0" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span class="sr-only">Search tools and lessons</span>
      <input id="search" type="search" placeholder="Search tools and lessons" autocomplete="off" class="flex-1 min-w-0 bg-transparent text-base text-fg placeholder:text-muted outline-none">
    </label>

    <div class="mt-4 flex flex-col gap-2">
      <div id="type-filters" class="flex flex-wrap gap-2" role="group" aria-label="Filter by type"></div>
      <div id="topic-filters" class="flex flex-wrap gap-2" role="group" aria-label="Filter by topic"></div>
    </div>

    <p id="results-status" class="sr-only" aria-live="polite"></p>
    <div id="card-grid" class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>

    <div id="empty-state" class="mt-5 border border-dashed border-line rounded-[2px] p-6 text-center" hidden>
      <p class="text-muted">No tools or lessons match.</p>
      <button id="clear-filters" type="button" class="mt-3 h-11 px-4 border border-line bg-surface rounded-[2px] font-display font-semibold uppercase tracking-wider hover:border-accent">Clear search &amp; filters</button>
    </div>
  </section>

  <!-- Item view: the selected tool or lesson is mounted into #item-mount -->
  <section id="view-item" hidden>
    <a href="#/" class="inline-flex items-center gap-1.5 min-h-[44px] text-muted hover:text-fg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      All tools &amp; lessons
    </a>
    <div class="mt-2 flex justify-between font-mono text-xs uppercase" id="item-meta"></div>
    <h1 id="item-title" tabindex="-1" class="mt-1 font-display font-semibold text-[32px] leading-tight uppercase tracking-wide outline-none"></h1>
    <div id="item-mount" class="mt-4"></div>
  </section>
</main>

<!-- ===== Item templates (one per catalogue entry) ===== -->

<template id="tpl-rankine-explainer">
  <div class="bg-surface border border-line rounded-[2px] p-4">
    <p class="text-muted">Placeholder — the interactive schematic, walkthrough, T–s diagram and quiz arrive in Phase 4.</p>
    <p class="mt-3 font-mono text-sm">Mounted for <span data-role="uptime" class="text-accent-ink">0</span> s</p>
  </div>
</template>

<template id="tpl-turbine-performance">
  <div class="bg-surface border border-line rounded-[2px] p-4">
    <p class="text-muted">Placeholder — single-reading and test-table modes arrive in Phase 3.</p>
    <p class="mt-3 font-mono text-sm">Mounted for <span data-role="uptime" class="text-accent-ink">0</span> s</p>
  </div>
</template>

<script>
'use strict';

// ===== Catalogue =====
// Adding a tool or lesson = one entry here + one <template>.
const CATALOG = [
  {
    id: 'rankine-cycle',
    type: 'lesson',
    code: 'S220-L1',
    title: 'Rankine Cycle Explainer',
    summary: 'Walk the S220 loop — boiler, turbine, condenser, feed pump — on the schematic and the T–s diagram, then check yourself.',
    topics: ['Thermodynamics', 'S220 rig'],
    keywords: ['rankine', 'cycle', 'boiler', 'condenser', 'feed pump', 'T-s', 'entropy', 'quiz'],
    templateId: 'tpl-rankine-explainer',
    init: initPlaceholder,
  },
  {
    id: 'turbine-performance',
    type: 'tool',
    code: 'S220-T1',
    title: 'Turbine Performance Calculator',
    summary: 'Torque, shaft power and specific steam consumption from your observation sheet, with every step worked.',
    topics: ['Thermodynamics', 'S220 rig'],
    keywords: ['torque', 'power', 'brake', 'steam consumption', 'SSC', 'speed', 'observation', 'test'],
    templateId: 'tpl-turbine-performance',
    init: initPlaceholder,
  },
];

const TYPE_LABELS = { tool: 'Tools', lesson: 'Lessons' };

// Placeholder init: proves the mount/destroy lifecycle (timer must stop on navigation).
function initPlaceholder(root) {
  const out = root.querySelector('[data-role="uptime"]');
  const started = Date.now();
  const timer = setInterval(() => {
    out.textContent = Math.floor((Date.now() - started) / 1000);
  }, 1000);
  return { destroy() { clearInterval(timer); } };
}

// ===== Theme =====
document.getElementById('theme-toggle').addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('s220-theme', dark ? 'dark' : 'light'); } catch (e) {}
});

// ===== Home: search + filters =====
const els = {
  home: document.getElementById('view-home'),
  item: document.getElementById('view-item'),
  search: document.getElementById('search'),
  typeFilters: document.getElementById('type-filters'),
  topicFilters: document.getElementById('topic-filters'),
  grid: document.getElementById('card-grid'),
  empty: document.getElementById('empty-state'),
  status: document.getElementById('results-status'),
  count: document.getElementById('item-count'),
  itemMeta: document.getElementById('item-meta'),
  itemTitle: document.getElementById('item-title'),
  mount: document.getElementById('item-mount'),
};

const homeState = { q: '', type: '', topic: '' };

const ALL_TOPICS = [...new Set(CATALOG.flatMap((e) => e.topics))].sort();

function matches(entry, state) {
  if (state.type && entry.type !== state.type) return false;
  if (state.topic && !entry.topics.includes(state.topic)) return false;
  const haystack = [entry.title, entry.summary, entry.code, ...entry.keywords, ...entry.topics].join(' ').toLowerCase();
  return state.q.toLowerCase().split(/\s+/).filter(Boolean).every((term) => haystack.includes(term));
}

function chip(label, pressed, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  b.setAttribute('aria-pressed', String(pressed));
  b.className = 'h-11 px-4 rounded-[2px] border font-display font-semibold text-[15px] uppercase tracking-wider ' +
    (pressed ? 'bg-accent border-accent text-on-accent' : 'bg-surface border-line text-fg hover:border-accent');
  b.addEventListener('click', onClick);
  return b;
}

function renderFilters() {
  els.typeFilters.replaceChildren(
    chip('All', homeState.type === '', () => setHomeState({ type: '' })),
    ...Object.entries(TYPE_LABELS).map(([type, label]) =>
      chip(label, homeState.type === type, () => setHomeState({ type: homeState.type === type ? '' : type })))
  );
  els.topicFilters.replaceChildren(
    ...ALL_TOPICS.map((topic) =>
      chip(topic, homeState.topic === topic, () => setHomeState({ topic: homeState.topic === topic ? '' : topic })))
  );
}

function card(entry) {
  const a = document.createElement('a');
  a.href = `#/${entry.type}/${entry.id}`;
  a.className = 'block bg-surface border border-line rounded-[2px] p-4 hover:border-accent focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent';

  const meta = document.createElement('div');
  meta.className = 'flex justify-between font-mono text-xs uppercase ' + (entry.type === 'tool' ? 'text-accent-ink' : 'text-steel');
  const kind = document.createElement('span');
  kind.textContent = entry.type;
  const code = document.createElement('span');
  code.textContent = entry.code;
  meta.append(kind, code);

  const title = document.createElement('h2');
  title.className = 'mt-1.5 font-display font-semibold text-2xl uppercase leading-tight';
  title.textContent = entry.title;

  const summary = document.createElement('p');
  summary.className = 'mt-1.5 text-[15px] leading-normal text-muted';
  summary.textContent = entry.summary;

  a.append(meta, title, summary);
  return a;
}

function renderGrid() {
  const results = CATALOG.filter((e) => matches(e, homeState));
  els.grid.replaceChildren(...results.map(card));
  els.empty.hidden = results.length > 0;
  els.count.textContent = '/ ' + String(results.length).padStart(2, '0');
  els.status.textContent = `${results.length} of ${CATALOG.length} items shown`;
}

function homeHash(state) {
  const params = new URLSearchParams();
  for (const key of ['q', 'type', 'topic']) if (state[key]) params.set(key, state[key]);
  const qs = params.toString();
  return qs ? `#/?${qs}` : '#/';
}

// Updates state, the URL (without a history entry or hashchange) and the view.
function setHomeState(patch) {
  Object.assign(homeState, patch);
  history.replaceState(null, '', homeHash(homeState));
  renderFilters();
  renderGrid();
}

els.search.addEventListener('input', () => setHomeState({ q: els.search.value }));
document.getElementById('clear-filters').addEventListener('click', () => {
  els.search.value = '';
  setHomeState({ q: '', type: '', topic: '' });
});

// ===== Router =====
let mounted = null;

function unmount() {
  if (mounted) {
    mounted.destroy();
    mounted = null;
  }
  els.mount.replaceChildren();
}

function showHome(params) {
  unmount();
  homeState.q = params.get('q') || '';
  homeState.type = TYPE_LABELS[params.get('type')] ? params.get('type') : '';
  homeState.topic = ALL_TOPICS.includes(params.get('topic')) ? params.get('topic') : '';
  els.search.value = homeState.q;
  renderFilters();
  renderGrid();
  els.item.hidden = true;
  els.home.hidden = false;
  document.title = 'S220 Lab Portal';
}

function showItem(entry) {
  unmount();
  els.itemMeta.className = 'mt-2 flex justify-between font-mono text-xs uppercase ' + (entry.type === 'tool' ? 'text-accent-ink' : 'text-steel');
  els.itemMeta.replaceChildren(
    Object.assign(document.createElement('span'), { textContent: entry.type }),
    Object.assign(document.createElement('span'), { textContent: entry.code })
  );
  els.itemTitle.textContent = entry.title;
  const fragment = document.getElementById(entry.templateId).content.cloneNode(true);
  els.mount.append(fragment);
  mounted = entry.init(els.mount) || { destroy() {} };
  els.home.hidden = true;
  els.item.hidden = false;
  document.title = `${entry.title} — S220 Lab Portal`;
  window.scrollTo(0, 0);
  els.itemTitle.focus();
}

function route() {
  const hash = location.hash.replace(/^#/, '') || '/';
  const [path, query = ''] = hash.split('?');
  const parts = path.split('/').filter(Boolean);

  if (parts.length === 0) return showHome(new URLSearchParams(query));

  if (parts.length === 2) {
    const entry = CATALOG.find((e) => e.type === parts[0] && e.id === parts[1]);
    if (entry) return showItem(entry);
  }

  // Unknown route: fall back to home and fix the URL.
  history.replaceState(null, '', '#/');
  showHome(new URLSearchParams());
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
